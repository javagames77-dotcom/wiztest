<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizoria — Об'єкти</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --accent:#8C64C9; --accent-hover:#a07ed8; --accent-light:rgba(140,100,201,.13); --accent-border:rgba(140,100,201,.3);
  --bg:#f4f4f7; --bg2:#ffffff; --bg3:#f0f0f4; --border:#e0e0e8; --border2:#ccccda;
  --text:#1a1a20; --muted:#6b6b80; --muted2:#aaaabc; --black:#0a0a12;
  --success:#16a34a; --success-bg:#f0fff4; --success-border:#bbf7d0;
  --danger:#c0392b; --danger-bg:#fff0f0; --danger-border:#ffd0d0;
  --warn-text:#92400e; --warn-bg:#fffbeb; --warn-border:#fde68a;
  --card-shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:13px}

.top-bar{position:sticky;top:0;height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:60;backdrop-filter:blur(16px);gap:14px}
.wizoria-logo{height:19px;width:auto;flex-shrink:0}
.brand-sub{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}
.nav-sep{flex:1}

.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:190px;min-width:190px;background:var(--bg3);border-right:1px solid var(--border);padding:14px 0;flex-shrink:0}
.sb-label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);padding:0 14px;margin-bottom:8px}
.sb-item{padding:9px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer}
.sb-item i{font-size:15px}
.sb-item:hover{color:var(--text)}
.sb-item.active{color:var(--accent);background:var(--accent-light);border-left:2px solid var(--accent);padding-left:12px}

.main{flex:1;min-width:0;padding:24px 28px 60px}

.page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.page-title{font-size:20px;font-weight:600;color:var(--black);letter-spacing:-.01em}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn-primary{background:var(--accent);border:none;border-radius:7px;height:32px;padding:0 13px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#fff;cursor:pointer}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-outline{border:1px solid var(--border);border-radius:7px;height:32px;padding:0 13px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--bg2)}
.btn-outline:hover{background:var(--bg3)}

/* --- Форма додавання --- */
.add-form{border:1px solid var(--accent-border);border-radius:10px;padding:16px;background:var(--accent-light);margin-bottom:16px}
.add-form-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-field label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}
.form-field input, .form-field select{width:100%;height:32px;border:1px solid var(--accent);border-radius:6px;background:var(--bg2);padding:0 10px;font-size:12px;font-family:inherit;color:var(--text);outline:none}
.form-field input:focus, .form-field select:focus{box-shadow:0 0 0 3px var(--accent-light)}
.form-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.form-col-fields{min-width:0}
.form-col-map{min-width:0}
#map{height:340px;border:1px solid var(--border);border-radius:7px;background:var(--bg3)}
.suggestion-item{padding:8px 10px;font-size:11px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border)}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover{background:var(--accent-light)}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-size:11px;font-weight:600;color:var(--accent);min-width:40px}
.form-actions{display:flex;justify-content:flex-end;gap:8px}
.field-err{font-size:10px;color:var(--danger);margin-top:3px;display:none}
.field-err.show{display:block}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th{text-align:left;padding:8px;font-weight:500;font-size:10px;color:var(--muted2);border-bottom:1px solid var(--border)}
td{padding:10px 8px;border-bottom:1px solid var(--border);color:var(--muted)}
tr:last-child td{border-bottom:none}
.obj-name{font-weight:500;color:var(--black)}
.status-badge{font-size:10px;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);border-radius:4px;padding:2px 7px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.edit-btn{border:1px solid var(--border);border-radius:5px;height:24px;padding:0 9px;display:inline-flex;align-items:center;font-size:10px;color:var(--muted);gap:4px;cursor:pointer;background:var(--bg2)}
.delete-btn{border:1px solid var(--danger-border);border-radius:5px;height:24px;padding:0 9px;display:inline-flex;align-items:center;font-size:10px;color:var(--danger);gap:4px;cursor:pointer;background:var(--bg2);margin-left:5px}
.delete-btn:hover{background:var(--danger-bg)}

.rows-cards{display:none}
.row-card{padding:12px 14px;border-bottom:1px solid var(--border)}
.row-card:last-child{border-bottom:none}
.row-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.row-card-meta{font-size:11px;color:var(--muted);line-height:1.6}

.empty-state{padding:32px 18px;text-align:center;color:var(--muted);font-size:12px}
.empty-state i{font-size:24px;display:block;margin-bottom:9px;opacity:.4}
.alert{padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:10px;display:none}
.alert.show{display:block}
.alert.err{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}

.auth-gate{max-width:420px;margin:80px auto;text-align:center;padding:0 20px}
.auth-gate p{color:var(--muted);font-size:13px;margin:10px 0 18px;line-height:1.6}
.auth-gate a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600}

@media (max-width: 720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;min-width:0;display:flex;align-items:center;padding:8px 6px;overflow-x:auto;gap:2px;border-right:none;border-bottom:1px solid var(--border)}
  .sb-label{display:none}
  .sb-item{white-space:nowrap;border-left:none !important;border-radius:7px;padding:7px 11px !important}
  .main{padding:16px 14px 40px}
  .form-row{grid-template-columns:1fr}
  .form-columns{grid-template-columns:1fr}
  #map{height:220px}
  table{display:none}
  .rows-cards{display:block}
}
</style>
</head>

<script>
function showModal({ icon = 'ℹ️', title, message, buttons, input }) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modal-overlay');
    document.getElementById('modal-icon').textContent = icon;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';

    let inputEl = document.getElementById('modal-input');
    if (input) {
      if (!inputEl) {
        inputEl = document.createElement('input');
        inputEl.id = 'modal-input';
        inputEl.type = 'text';
        inputEl.style.cssText = 'width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);padding:0 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none;margin-bottom:14px;display:block';
        document.getElementById('modal-message').insertAdjacentElement('afterend', inputEl);
      }
      inputEl.style.display = 'block';
      inputEl.value = input.value || '';
      inputEl.placeholder = input.placeholder || '';
    } else if (inputEl) {
      inputEl.style.display = 'none';
    }

    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      btn.className = b.variant === 'primary' ? 'btn-primary' : (b.variant === 'danger' ? 'btn-primary' : 'btn-outline');
      if (b.variant === 'danger') btn.style.background = 'var(--danger)';
      btn.addEventListener('click', () => {
        overlay.style.display = 'none';
        const val = (input && b.value === true) ? inputEl.value.trim() : b.value;
        resolve(val);
      });
      actions.appendChild(btn);
    });

    overlay.style.display = 'flex';
    if (input) setTimeout(() => inputEl && inputEl.focus(), 50);
  });
}

function showPromptDialog(message, title = 'Введіть значення', placeholder = '', value = '', confirmLabel = 'Створити') {
  return showModal({
    icon: '✏️', title, message, input: { placeholder, value },
    buttons: [
      { label: 'Скасувати', value: false, variant: 'outline' },
      { label: confirmLabel, value: true, variant: 'primary' }
    ]
  });
}

function showConfirmDialog(message, title = 'Підтвердіть дію') {
  return showModal({
    icon: '⚠️', title, message,
    buttons: [
      { label: 'Скасувати', value: false, variant: 'outline' },
      { label: 'Так, продовжити', value: true, variant: 'danger' }
    ]
  });
}

function showAlertDialog(message, title = 'Повідомлення') {
  return showModal({
    icon: 'ℹ️', title, message,
    buttons: [{ label: 'Гаразд', value: true, variant: 'primary' }]
  });
}
</script>
<script>
const API_BASE = 'https://primary-production-3872.up.railway.app/webhook';
let token = null;
function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }
let leafletMap = null, marker = null, geoCircle = null;
let selectedLat = 49.5883, selectedLng = 34.5514; // Полтава — центр за замовчуванням
let addressDebounce = null;
let suppressNextGeocode = false; // щоб не запускати зворотний геокодинг одразу після вибору підказки

function currentRadius() {
  return Number(document.getElementById('f-radius').value);
}

function updateCircle() {
  if (!geoCircle) return;
  geoCircle.setLatLng([selectedLat, selectedLng]);
  geoCircle.setRadius(currentRadius());
}

async function reverseGeocode(lat, lng) {
  try {
    const res = await fetch(`${API_BASE}/ga/admin/geocode`, {
      method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lon: lng })
    });
    const rd = await res.json();
    if (rd.success && rd.results && rd.results[0] && rd.results[0].display_name) {
      document.getElementById('f-address').value = rd.results[0].display_name;
    }
  } catch (err) {
    console.error('Geocode reverse error:', err);
  }
}

function movePinTo(lat, lng) {
  selectedLat = lat; selectedLng = lng;
  marker.setLatLng([lat, lng]);
  leafletMap.setView([lat, lng], leafletMap.getZoom());
  updateCircle();
}

function initMap() {
  leafletMap = L.map('map').setView([selectedLat, selectedLng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18
  }).addTo(leafletMap);

  marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(leafletMap);
  geoCircle = L.circle([selectedLat, selectedLng], {
    radius: currentRadius(), color: '#8C64C9', fillColor: '#8C64C9', fillOpacity: 0.12, weight: 1.5
  }).addTo(leafletMap);

  marker.on('dragend', () => {
    const p = marker.getLatLng();
    selectedLat = p.lat; selectedLng = p.lng;
    updateCircle();
    reverseGeocode(selectedLat, selectedLng);
  });

  leafletMap.on('click', (e) => {
    selectedLat = e.latlng.lat; selectedLng = e.latlng.lng;
    marker.setLatLng(e.latlng);
    updateCircle();
    reverseGeocode(selectedLat, selectedLng);
  });
}

document.getElementById('f-radius').addEventListener('input', (e) => {
  document.getElementById('f-radius-val').textContent = e.target.value + 'м';
  updateCircle();
});

// --- Автокомплит адреси (Nominatim search) ---
const addressInput = document.getElementById('f-address');
const suggestionsBox = document.getElementById('address-suggestions');

function hideSuggestions() {
  suggestionsBox.style.display = 'none';
  suggestionsBox.innerHTML = '';
}

addressInput.addEventListener('input', () => {
  if (suppressNextGeocode) { suppressNextGeocode = false; return; }
  clearTimeout(addressDebounce);
  const query = addressInput.value.trim();
  if (query.length < 3) { hideSuggestions(); document.getElementById('address-status').style.display = 'none'; return; }

  addressDebounce = setTimeout(async () => {
    const statusEl = document.getElementById('address-status');
    statusEl.style.display = 'none';
    try {
      const res = await fetch(`${API_BASE}/ga/admin/geocode`, {
        method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: query })
      });
      const rd = await res.json();
      const results = (rd.success && rd.results) || [];
      if (!results.length) {
        statusEl.textContent = 'Нічого не знайдено';
        statusEl.style.display = 'block';
        hideSuggestions(); return;
      }

      suggestionsBox.innerHTML = '';
      results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.textContent = r.display_name;
        item.addEventListener('click', () => {
          suppressNextGeocode = true;
          addressInput.value = r.display_name;
          if (leafletMap) movePinTo(Number(r.lat), Number(r.lon));
          hideSuggestions();
        });
        suggestionsBox.appendChild(item);
      });
      suggestionsBox.style.display = 'block';
    } catch (err) {
      console.error('Geocode search error:', err);
      statusEl.textContent = "Немає з'єднання з сервісом пошуку адрес";
      statusEl.style.display = 'block';
      hideSuggestions();
    }
  }, 500);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#address-suggestions') && e.target !== addressInput) hideSuggestions();
});

document.getElementById('toggle-form-btn').addEventListener('click', () => {
  const form = document.getElementById('add-form');
  const showing = form.style.display !== 'none';
  if (showing) {
    form.style.display = 'none';
    return;
  }
  resetFormToCreateMode();
  form.style.display = 'block';
  if (!leafletMap) {
    setTimeout(() => { initMap(); leafletMap.invalidateSize(); }, 50);
  } else {
    setTimeout(() => leafletMap.invalidateSize(), 50);
  }
});
document.getElementById('cancel-btn').addEventListener('click', () => {
  document.getElementById('add-form').style.display = 'none';
  resetFormToCreateMode();
});

function showFormError(msg) {
  const el = document.getElementById('form-alert');
  el.textContent = msg;
  el.className = 'alert err show';
}
function clearFormError() {
  document.getElementById('form-alert').className = 'alert err';
}

async function loadClients() {
  const res = await fetch(`${API_BASE}/ga/admin/clients`, { headers: authHeaders() });
  const data = await res.json();
  const select = document.getElementById('f-client');
  const prevValue = select.value;
  select.innerHTML = '';
  (data.clients || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    select.appendChild(opt);
  });
  if (prevValue) select.value = prevValue;
}

document.getElementById('new-client-btn').addEventListener('click', async () => {
  const name = await showPromptDialog("Назва мережі кінотеатрів", 'Нова мережа', 'напр. CinemaCity');
  if (!name) return;
  try {
    const res = await fetch(`${API_BASE}/ga/admin/clients`, {
      method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (!data.success) { await showAlertDialog(data.error || 'Помилка створення мережі', 'Помилка'); return; }
    await loadClients();
    document.getElementById('f-client').value = data.client.id;
  } catch (e) {
    await showAlertDialog("Немає з'єднання з сервером", 'Помилка');
  }
});

document.getElementById('rename-client-btn').addEventListener('click', async () => {
  const select = document.getElementById('f-client');
  const clientId = Number(select.value);
  if (!clientId) return;
  const currentName = select.options[select.selectedIndex]?.textContent || '';
  const name = await showPromptDialog('Нова назва мережі', 'Перейменувати мережу', '', currentName, 'Зберегти');
  if (!name) return;
  try {
    const res = await fetch(`${API_BASE}/ga/admin/clients/update`, {
      method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: clientId, name })
    });
    const data = await res.json();
    if (!data.success) { await showAlertDialog(data.error || 'Помилка перейменування', 'Помилка'); return; }
    await loadClients();
    select.value = clientId;
  } catch (e) {
    await showAlertDialog("Немає з'єднання з сервером", 'Помилка');
  }
});

document.getElementById('delete-client-btn').addEventListener('click', async () => {
  const select = document.getElementById('f-client');
  const clientId = Number(select.value);
  if (!clientId) return;
  const name = select.options[select.selectedIndex]?.textContent || 'цю мережу';
  const ok = await showConfirmDialog(`Видалити мережу «${name}»? Дію не можна скасувати.`, 'Підтвердіть видалення');
  if (!ok) return;
  try {
    const res = await fetch(`${API_BASE}/ga/admin/clients/delete`, {
      method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: clientId })
    });
    const data = await res.json();
    if (!data.success) { await showAlertDialog(data.error || 'Помилка видалення', 'Помилка'); return; }
    await loadClients();
  } catch (e) {
    await showAlertDialog("Немає з'єднання з сервером", 'Помилка');
  }
});

async function loadSupervisors() {
  const res = await fetch(`${API_BASE}/ga/admin/users?role=supervisor`, { headers: authHeaders() });
  const data = await res.json();
  const select = document.getElementById('f-supervisor');
  (data.users || []).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id; opt.textContent = `${u.first_name} ${u.last_name}`;
    select.appendChild(opt);
  });
}

async function loadSupervisorAssignments() {
  // Об'єдную дані з двох ендпоінтів на фронті (без змін бекенду):
  // GET /ga/admin/objects не містить supervisor, а /ga/admin/supervisor-objects — містить.
  const res = await fetch(`${API_BASE}/ga/admin/supervisor-objects`, { headers: authHeaders() });
  const data = await res.json();
  const map = {};
  (data.assignments || []).forEach(a => {
    map[a.object_id] = { name: `${a.first_name} ${a.last_name}`, supervisor_id: a.supervisor_id };
  });
  return map;
}

let allObjects = [];
let allSupMap = {};

async function loadObjects() {
  const [objRes, supMap] = await Promise.all([
    fetch(`${API_BASE}/ga/admin/objects`, { headers: authHeaders() }),
    loadSupervisorAssignments()
  ]);
  const objData = await objRes.json();
  const tbody = document.getElementById('objects-tbody');
  const cards = document.getElementById('objects-cards');
  const empty = document.getElementById('objects-empty');
  tbody.innerHTML = ''; cards.innerHTML = '';

  // Неактивні (видалені) об'єкти ховаємо зі списку — саме такої поведінки очікує адмін від кнопки «Видалити»
  const objects = (objData.objects || []).filter(o => o.is_active);
  allObjects = objects;
  allSupMap = supMap;

  if (objects.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  objects.forEach(o => {
    const supInfo = supMap[o.id];
    const supervisorName = supInfo ? supInfo.name : '—';
    tbody.insertAdjacentHTML('beforeend', `
      <tr>
        <td class="obj-name">${o.name}</td>
        <td>${o.address || '—'}${o.city ? ` <span style="color:var(--muted2)">· ${o.city}</span>` : ''}</td>
        <td>${supervisorName}</td>
        <td><span class="status-badge"><i class="ti ti-check"></i>${o.is_active ? 'Активний' : 'Неактивний'}</span></td>
        <td style="text-align:right"><span class="edit-btn" data-object-id="${o.id}"><i class="ti ti-pencil"></i>Редагувати</span><span class="delete-btn" data-object-id="${o.id}"><i class="ti ti-trash"></i>Видалити</span></td>
      </tr>
    `);
    cards.insertAdjacentHTML('beforeend', `
      <div class="row-card">
        <div class="row-card-top">
          <span class="obj-name">${o.name}</span>
          <span class="status-badge"><i class="ti ti-check"></i>Активний</span>
        </div>
        <div class="row-card-meta">${o.address || '—'}<br>Supervisor: ${supervisorName}</div>
        <div style="margin-top:8px"><span class="edit-btn" data-object-id="${o.id}"><i class="ti ti-pencil"></i>Редагувати</span><span class="delete-btn" data-object-id="${o.id}"><i class="ti ti-trash"></i>Видалити</span></div>
      </div>
    `);
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openFormForEdit(Number(btn.dataset.objectId)));
  });
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteObject(Number(btn.dataset.objectId), btn));
  });
}

async function deleteObject(objectId, btnEl) {
  const obj = allObjects.find(o => o.id === objectId);
  const name = obj ? obj.name : `#${objectId}`;
  const ok = await showConfirmDialog(`Видалити об'єкт «${name}»? Об'єкт стане неактивним (дані анкет/завдань збережуться).`, "Видалення об'єкту");
  if (!ok) return;

  try {
    const res = await fetch(`${API_BASE}/ga/admin/objects/delete`, {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ object_id: objectId })
    });
    const data = await res.json();
    if (!data.success) { await showAlertDialog(data.error || 'Помилка видалення', 'Помилка'); return; }
    await loadObjects();
  } catch (err) {
    await showAlertDialog("Немає з'єднання з сервером", 'Помилка');
  }
}

let editingObjectId = null;

async function openFormForEdit(objectId) {
  const obj = allObjects.find(o => o.id === objectId);
  if (!obj) return;

  editingObjectId = objectId;
  const form = document.getElementById('add-form');
  form.style.display = 'block';
  document.querySelector('.add-form-title').innerHTML = '<i class="ti ti-pencil"></i> Редагування об\'єкту';
  document.getElementById('save-btn').textContent = 'Оновити об\'єкт';

  document.getElementById('f-client').value = obj.client_id;
  document.getElementById('f-name').value = obj.name;
  document.getElementById('f-address').value = obj.address || '';
  document.getElementById('f-city').value = obj.city || '';
  document.getElementById('f-radius').value = obj.geo_radius_m || 150;
  document.getElementById('f-radius-val').textContent = (obj.geo_radius_m || 150) + 'м';

  const supInfo = allSupMap[objectId];
  document.getElementById('f-supervisor').value = supInfo ? supInfo.supervisor_id : '';

  selectedLat = Number(obj.latitude);
  selectedLng = Number(obj.longitude);

  if (!leafletMap) {
    setTimeout(() => {
      initMap();
      leafletMap.invalidateSize();
      movePinTo(selectedLat, selectedLng);
    }, 50);
  } else {
    setTimeout(() => {
      leafletMap.invalidateSize();
      movePinTo(selectedLat, selectedLng);
    }, 50);
  }
}

function resetFormToCreateMode() {
  editingObjectId = null;
  document.querySelector('.add-form-title').innerHTML = '<i class="ti ti-plus"></i> Новий об\'єкт';
  document.getElementById('save-btn').textContent = 'Зберегти об\'єкт';
  document.getElementById('f-name').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('f-city').value = '';
  document.getElementById('f-supervisor').value = '';
  document.getElementById('f-radius').value = 150;
  document.getElementById('f-radius-val').textContent = '150м';
}

document.getElementById('save-btn').addEventListener('click', async () => {
  clearFormError();
  document.getElementById('err-name').classList.remove('show');

  const clientId = document.getElementById('f-client').value;
  const name = document.getElementById('f-name').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const city = document.getElementById('f-city').value.trim();
  const radius = document.getElementById('f-radius').value;
  const supervisorId = document.getElementById('f-supervisor').value;

  if (!name) {
    document.getElementById('err-name').textContent = "Назва об'єкту обов'язкова";
    document.getElementById('err-name').classList.add('show');
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = editingObjectId ? 'Оновлюємо…' : 'Зберігаємо…';

  try {
    let objectId;

    if (editingObjectId) {
      // --- РЕЖИМ РЕДАГУВАННЯ ---
      const res = await fetch(`${API_BASE}/ga/admin/objects/update`, {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
          object_id: editingObjectId, client_id: Number(clientId), name, address, city,
          latitude: selectedLat, longitude: selectedLng, geo_radius_m: Number(radius),
          supervisor_id: supervisorId ? Number(supervisorId) : null
        })
      });
      const data = await res.json();
      if (!data.success) { showFormError(data.error || 'Помилка'); return; }
      objectId = editingObjectId;
    } else {
      // --- РЕЖИМ СТВОРЕННЯ ---
      const res = await fetch(`${API_BASE}/ga/admin/objects`, {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_id: Number(clientId), name, address, city,
          latitude: selectedLat, longitude: selectedLng, geo_radius_m: Number(radius)
        })
      });
      const data = await res.json();
      if (!data.success) { showFormError(data.error || 'Помилка'); return; }
      objectId = data.object.id;

      if (supervisorId) {
        await fetch(`${API_BASE}/ga/admin/supervisor-objects`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ supervisor_id: Number(supervisorId), object_id: objectId })
        });
      }
    }

    document.getElementById('add-form').style.display = 'none';
    resetFormToCreateMode();
    await loadObjects();
  } catch (err) {
    showFormError("Немає з'єднання з сервером");
  } finally {
    btn.disabled = false;
    btn.textContent = editingObjectId ? 'Оновити об\'єкт' : 'Зберегти об\'єкт';
  }
});

async function init() {
  token = localStorage.getItem('ga_token');
  if (!token) { document.getElementById('auth-gate').style.display = 'block'; return; }

  try {
    await Promise.all([loadClients(), loadSupervisors()]);
    await loadObjects();
    document.getElementById('page-body').style.display = 'flex';
  } catch (err) {
    document.getElementById('auth-gate').style.display = 'block';
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('ga_token');
  window.location.href = 'login.html';
});

init();
</script>
